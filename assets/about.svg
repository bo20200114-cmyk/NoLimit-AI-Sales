    <ellipse cx="432" cy="108" rx="66" ry="92" fill="#5b2f1a" opacity="0.9"/>
    <rect x="88" y="36" width="150" height="150" fill="url(#meshPat-about)" opacity="0.55"/>
    <polygon points="300,150 400,60 424,78 320,170" fill="#8a3a20" opacity="0.92"/>
  </g>

  <!-- collar pad (ankle opening rim) -->
  <path d="M204,40 C208,50 210,62 218,68 C232,78 250,80 264,72 C272,66 276,56 286,48 C302,34 324,26 350,26 C372,26 392,32 408,42"
        fill="none" stroke="#3a2013" stroke-width="13" stroke-linecap="round" opacity="0.95"/>

  <!-- tongue -->
  <path d="M206,44 C204,32 210,20 224,16 C238,12 250,18 252,30 C253,40 248,50 238,54 C226,58 210,54 206,44 Z" fill="#e3c9a3"/>

  <!-- laces -->
  <path d="M198,58 L246,42" stroke="#20222a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M204,72 L254,54" stroke="#20222a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M212,86 L262,66" stroke="#20222a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M222,99 L270,78" stroke="#20222a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="198" cy="58" r="4" fill="#1c1c1e"/>
      <circle cx="204" cy="72" r="4" fill="#1c1c1e"/>
      <circle cx="212" cy="86" r="4" fill="#1c1c1e"/>
      <circle cx="222" cy="99" r="4" fill="#1c1c1e"/>
  <circle cx="246" cy="42" r="4" fill="#1c1c1e"/>
      <circle cx="254" cy="54" r="4" fill="#1c1c1e"/>
      <circle cx="262" cy="66" r="4" fill="#1c1c1e"/>
      <circle cx="270" cy="78" r="4" fill="#1c1c1e"/>

