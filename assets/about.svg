      <line x1="0" y1="0" x2="0" y2="14" stroke="#a9784a" stroke-width="2.4"/>
    </pattern>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="240" cy="218" rx="220" ry="18" fill="#000000" opacity="0.35"/>

