<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200">
  <defs><radialGradient id="bg-about" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#33363c"/><stop offset="60%" stop-color="#111214"/><stop offset="100%" stop-color="#040404"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#bg-about)"/>
  <g transform="translate(150 620) rotate(4) scale(1.85)">
    
  <defs>
    <clipPath id="upperClip-about">
      <path d="M16,166
C8,146 14,124 32,106
C56,82 92,64 130,54
C160,46 185,42 202,40
C206,50 208,62 216,68
C230,78 248,80 262,72
C270,66 274,56 284,48
