      <stop offset="100%" stop-color="#c9a06c"/>
    </linearGradient>
    <linearGradient id="soleGrad-about" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="meshPat-about" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
