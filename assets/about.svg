  <rect x="6" y="192" width="454" height="30" rx="15" fill="url(#soleGrad-about)"/>
  <rect x="20" y="200" width="426" height="4" rx="2" fill="#000000" opacity="0.35"/>

  <!-- midsole -->
  <rect x="14" y="168" width="438" height="26" rx="13" fill="#f1efe9"/>
  <rect x="14" y="186" width="438" height="8" rx="4" fill="#8a3a20"/>

  <!-- upper base -->
  <path d="M16,166
C8,146 14,124 32,106
C56,82 92,64 130,54
C160,46 185,42 202,40
C206,50 208,62 216,68
C230,78 248,80 262,72
C270,66 274,56 284,48
C300,34 322,26 348,26
C378,26 405,36 424,54
C442,71 452,92 452,114
C452,132 446,148 434,160
L434,166
L16,166 Z" fill="url(#baseGrad-about)"/>

